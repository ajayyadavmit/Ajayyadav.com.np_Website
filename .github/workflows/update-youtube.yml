name: Update YouTube Videos

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/scripts/fetch_youtube.py"
      - ".github/workflows/update-youtube.yml"

concurrency:
  group: youtube-feed-update
  cancel-in-progress: true

jobs:
  update-youtube-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Fetch YouTube videos
        run: python .github/scripts/fetch_youtube.py
        timeout-minutes: 2

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add youtube-videos.json

          if git diff --cached --quiet; then
            echo "No changes to YouTube feed."
          else
            git commit -m "Update YouTube videos feed"
            git push
          fi


name: Update YouTube Videos

on:
  schedule:
    # Run every 6 hours, at 17 minutes past the hour
    - cron: "17 */6 * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

  # Also update when the Python script changes
  push:
    paths:
      - ".github/scripts/fetch_youtube.py"
      - ".github/workflows/update-youtube.yml"

permissions:
  contents: write

jobs:
  update-youtube-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch YouTube videos
        run: python .github/scripts/fetch_youtube.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add youtube-videos.json

          if git diff --cached --quiet; then
            echo "No changes to YouTube feed."
          else
            git commit -m "Update YouTube videos feed"
            git push
          fi
